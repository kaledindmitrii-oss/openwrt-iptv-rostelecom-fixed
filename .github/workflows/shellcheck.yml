name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Syntax check
        run: sh -n iptv-manager.sh
      - name: ShellCheck version
        run: shellcheck --version
      - name: ShellCheck
        run: shellcheck --shell=sh --severity=warning iptv-manager.sh
      - name: Static safety checks
        run: sh tests/static-audit.sh
